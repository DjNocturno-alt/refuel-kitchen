<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refuel Kitchen - Greensboro Food Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--orange:#e8431a;--dark:#1a1a1a;--bg:#f5f0e8;--card:#fff;--border:#e8e0d0;--muted:#888;--green:#16a34a}
        html{scroll-behavior:smooth}
        body{background:var(--dark);font-family:'DM Sans',sans-serif;color:var(--dark)}
        
        /* Nav & Hero */
        nav{background:var(--dark);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,0.08)}
        .nav-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;letter-spacing:1px}
        .nav-logo span{color:var(--orange)}
        .cart-btn{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
        .cart-count.hidden{display:none}
        
        .hero{background:var(--dark);padding:56px 24px;text-align:center;position:relative;color:#fff}
        .hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(50px,10vw,80px);line-height:0.9}
        .hero h1 span{color:var(--orange)}
        .hero-cta{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:16px 40px;font-family:'Bebas Neue',sans-serif;font-size:24px;margin-top:20px;cursor:pointer}

        /* Menu */
        .menu-section{background:var(--bg);padding:40px 20px}
        .cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:15px;margin-bottom:20px}
        .cat-tab{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:8px 16px;white-space:nowrap;cursor:pointer}
        .cat-tab.active{background:var(--orange);color:#fff;border-color:var(--orange)}
        .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
        .menu-item{background:#fff;padding:20px;border-radius:12px;border:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .item-name{font-weight:700;font-size:16px}
        .item-price{color:var(--orange);font-family:'Bebas Neue',sans-serif;font-size:20px}
        .add-btn{width:35px;height:35px;border-radius:50%;background:var(--orange);color:#fff;border:none;font-size:20px;cursor:pointer}

        /* Cart & Modals */
        .cart-overlay, .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none}
        .cart-overlay.open, .modal-overlay.open{display:flex; align-items:center; justify-content:center}
        .cart-drawer{position:fixed;right:0;top:0;bottom:0;width:100%;max-width:400px;background:#fff;z-index:201;transform:translateX(100%);transition:0.3s;display:flex;flex-direction:column}
        .cart-drawer.open{transform:translateX(0)}
        .cart-body{flex:1;overflow-y:auto;padding:20px}
        .modal{background:#fff;padding:30px;border-radius:15px;width:95%;max-width:450px;max-height:90vh;overflow-y:auto}
        .form-input{width:100%;padding:12px;margin-bottom:10px;border:1.5px solid var(--border);border-radius:8px}
        .place-btn{width:100%;background:var(--orange);color:#fff;padding:15px;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:22px;cursor:pointer}
        .cash-opt.selected{background:var(--dark);color:#fff}
        
        /* Mobile Dynamic Height Fix */
        .cart-drawer { height: 100dvh; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">REFUEL <span>KITCHEN</span></div>
        <button class="cart-btn" onclick="openCart()">Cart <span id="cart-count">0</span></button>
    </nav>

    <div class="hero">
        <h1>REFUEL<br><span>KITCHEN</span></h1>
        <p>Smoked - Fried - Delivered in Greensboro</p>
        <button class="hero-cta" onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">ORDER NOW</button>
    </div>

    <div class="menu-section" id="menu">
        <div class="cat-tabs" id="cat-tabs"></div>
        <div id="menu-cats"></div>
    </div>

    <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div style="padding:20px; border-bottom:1px solid #ddd; display:flex; justify-content:space-between">
            <h2>Your Order</h2>
            <button onclick="closeCart()">X</button>
        </div>
        <div class="cart-body" id="cart-body"></div>
        <div style="padding:20px; border-top:1px solid #ddd">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px">
                <b>Total (+$4 Delivery)</b>
                <b id="c-total">$0.00</b>
            </div>
            <button class="place-btn" id="checkout-btn" onclick="openCheckout()" disabled>CHECKOUT</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal"></div>
    </div>

    <script>
        var EP = 'https://script.google.com/macros/s/AKfycby7DXpm6M2L1QNQ8LeA8uIzG9vvJBtQh5ZzsRkPEGUcWPrqOqBLWuXZVlC95ZIhUzN22A/exec';
        var cart = {};
        const MENU = [
            {cat: 'Smoked Specialties', items: [{id:'so', name:'Smoked Oxtails', price:18}, {id:'sw', name:'Smoked Wings', price:12}, {id:'sb', name:'Smoked Burger', price:10}]},
            {cat: 'Fried Favorites', items: [{id:'fw', name:'Fried Wings', price:10}, {id:'ff', name:'Fried Fish', price:10}, {id:'fr', name:'French Fries', price:3}]},
            {cat: 'Drinks', items: [{id:'st', name:'Sweet Tea', price:3}, {id:'sd', name:'Soda', price:2}]}
        ];

        function build() {
            const tabs = document.getElementById('cat-tabs');
            const cats = document.getElementById('menu-cats');
            MENU.forEach((cat, i) => {
                const btn = document.createElement('button');
                btn.className = `cat-tab ${i===0?'active':''}`;
                btn.textContent = cat.cat;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`cat-${i}`).scrollIntoView({behavior:'smooth'});
                };
                tabs.appendChild(btn);

                const div = document.createElement('div');
                div.id = `cat-${i}`;
                div.innerHTML = `<h2 style="margin:20px 0; font-family:'Bebas Neue'">${cat.cat}</h2><div class="items-grid" id="g-${i}"></div>`;
                cats.appendChild(div);
                cat.items.forEach(item => {
                    const grid = document.getElementById(`g-${i}`);
                    const itemEl = document.createElement('div');
                    itemEl.className = 'menu-item';
                    itemEl.innerHTML = `<div><div class="item-name">${item.name}</div><div class="item-price">$${item.price}</div></div>
                        <button class="add-btn" onclick="addI('${item.id}')">+</button>`;
                    grid.appendChild(itemEl);
                });
            });
        }

        function addI(id) {
            let item;
            MENU.forEach(c => { const f = c.items.find(x => x.id === id); if(f) item = f; });
            if(!cart[id]) cart[id] = {item, qty:0};
            cart[id].qty++;
            sync();
        }

        function sync() {
            const vals = Object.values(cart);
            const sub = vals.reduce((s, c) => s + (c.item.price * c.qty), 0);
            document.getElementById('cart-count').textContent = vals.reduce((s, c) => s + c.qty, 0);
            document.getElementById('c-total').textContent = `$${(sub + (sub>0?4:0)).toFixed(2)}`;
            document.getElementById('checkout-btn').disabled = sub < 10;
            renderCart();
        }

        function renderCart() {
            const body = document.getElementById('cart-body');
            body.innerHTML = Object.values(cart).map(c => `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px">
                    <span>${c.item.name} (x${c.qty})</span>
                    <span>$${(c.item.price * c.qty).toFixed(2)}</span>
                </div>
            `).join('');
        }

        function openCheckout() {
            closeCart();
            document.getElementById('modal-overlay').classList.add('open');
            document.getElementById('modal').innerHTML = `
                <h2>Delivery Details</h2>
                <input class="form-input" id="mn" placeholder="Your Name">
                <input class="form-input" id="mp" placeholder="Phone Number">
                <input class="form-input" id="ma" placeholder="Address">
                <p style="margin:10px 0"><b>Select Payment Method:</b></p>
                <div style="display:flex; gap:10px; margin-bottom:15px">
                    <button class="cat-tab" onclick="setPay(this,'Cash App')">Cash App</button>
                    <button class="cat-tab" onclick="setPay(this,'Venmo')">Venmo</button>
                    <button class="cat-tab" onclick="setPay(this,'Cash')">Cash</button>
                </div>
                <button class="place-btn" onclick="placeOrder()">PLACE ORDER</button>
            `;
        }

        var selectedPay = '';
        function setPay(btn, method) {
            selectedPay = method;
            document.querySelectorAll('.modal .cat-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        }

        function placeOrder() {
            const name = document.getElementById('mn').value;
            const items = Object.values(cart).map(c => `${c.item.name} x${c.qty}`).join(', ');
            fetch(EP, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ name, items, method: selectedPay, date: new Date().toLocaleString() })
            });
            document.getElementById('modal').innerHTML = `<div style="text-align:center"><h2>Order Placed!</h2><p>We will text you shortly.</p><button class="place-btn" onclick="location.reload()">OK</button></div>`;
        }

        function openCart() { document.getElementById('cart-drawer').classList.add('open'); document.getElementById('cart-overlay').classList.add('open'); }
        function closeCart() { document.getElementById('cart-drawer').classList.remove('open'); document.getElementById('cart-overlay').classList.remove('open'); }
        build();
    </script>
</body>
</html>
